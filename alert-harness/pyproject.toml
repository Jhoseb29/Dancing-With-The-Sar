[project]
name = "alert-harness"
version = "0.1.0"
description = "Alertas tempranas por cuenca: lluvia (IMERG) + relieve (DEM) + evidencia radar (NISAR/Sentinel-1), con indicadores validados por JSON Schema y evaluación contra casos reales"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "h5py>=3.10.0",
    "rasterio>=1.3.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0",
    "pillow>=10.2.0",
    "shapely>=2.0",
]

[tool.uv]
package = false
