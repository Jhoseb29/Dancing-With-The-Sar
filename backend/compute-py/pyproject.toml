[project]
name = "dws-compute-py"
version = "0.1.0"
description = "Dancing with the SARs · runtime Python (FastAPI): eventos, geoprocesamiento y puente al harness NISAR"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings>=2",
  "jsonschema>=4",
  "httpx==0.28.1",
  "shapely==2.1.2",
  "numpy>=1.26.0",
  "rasterio>=1.3.10",
  "pillow>=10.2.0",
  "google-genai==3.3.0",
]

[tool.uvicorn]
# Ejecutar: .venv/Scripts/python -m uvicorn main:app --app-dir src --port 8000
