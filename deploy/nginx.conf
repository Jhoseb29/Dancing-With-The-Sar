server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 1.1.1.1 valid=60s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/geo+json;
    gzip_min_length 1024;

    # TLEs satelitales (reemplaza proxy.conf.mjs en producción)
    location = /api/orbit/nisar {
        set $celestrak_nisar "https://celestrak.org/NORAD/elements/gp.php?NAME=NISAR&FORMAT=TLE";
        proxy_pass $celestrak_nisar;
        proxy_ssl_server_name on;
        proxy_set_header Host celestrak.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    location = /api/orbit/sentinel1 {
        set $celestrak_s1 "https://celestrak.org/NORAD/elements/gp.php?NAME=SENTINEL-1&FORMAT=TLE";
        proxy_pass $celestrak_s1;
        proxy_ssl_server_name on;
        proxy_set_header Host celestrak.org;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # WebSocket de alertas tempranas
    location = /api/alerts/ws {
        proxy_pass http://compute-py:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Stream NDJSON de análisis NISAR (sin buffering y timeout largo)
    location /api/harness {
        proxy_pass http://compute-py:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
    }

    # API Python (alerts, basin, events, voice, health)
    location /api/ {
        proxy_pass http://compute-py:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
    }

    # Runtime/config JSON sin caché agresivo
    location ~* ^/assets/(runtime-config\.json|config/.*\.json|i18n/.*\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
