<app-map-canvas (ready)="onCanvasReady($event)" />

<app-side-panel
  [open]="scene.panels().layerPanel"
  [label]="'risk.title' | transloco"
  [hideLabel]="'panel.hide' | transloco"
  (openChange)="setPanelOpen($event)"
>
  <div class="top">
    <p class="caption">{{ 'risk.kicker' | transloco }}</p>
    <p class="caption live" [attr.data-state]="alerts.connection()">
      {{ 'risk.connection.' + alerts.connection() | transloco }}
    </p>
  </div>

  <div class="tabs" role="tablist" [attr.aria-label]="'risk.title' | transloco">
    @for (t of tabs; track t; let idx = $index) {
      <button
        type="button"
        role="tab"
        [id]="'risk-tab-' + t"
        [attr.aria-selected]="tab() === t"
        [attr.tabindex]="tab() === t ? 0 : -1"
        (click)="selectTab(t)"
        (keydown)="onTabKeydown($event, idx)"
      >
        {{ 'risk.tabs.' + t | transloco }}
      </button>
    }
  </div>

  <div role="tabpanel" [attr.aria-labelledby]="'risk-tab-' + tab()">
    @switch (tab()) {
      @case ('now') {
        <app-stations-panel />
      }
      @case ('tanks') {
        <app-tanks-panel />
      }
      @case ('how') {
        <app-how-it-works />
      }
      @case ('eval') {
        <app-eval-view [evaluation]="alerts.evaluation()" />
      }
    }
  </div>
</app-side-panel>
