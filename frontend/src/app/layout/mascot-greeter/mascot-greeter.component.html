<aside
  class="mascot-stage"
  [attr.data-phase]="phase()"
  [attr.aria-label]="'mascot.role' | transloco"
>
  @if (phase() === 'greeting') {
    <div class="speech-card panel" role="status" aria-live="polite">
      <header class="speech-head">
        <span class="badge caption">
          <span class="pulse-dot" [class.active]="isSpeaking()"></span>
          {{ 'mascot.role' | transloco }}
        </span>

        <div class="eq" [class.active]="isSpeaking()" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </header>

      <p class="greeting-line">
        <span>{{ typedText() }}</span>
        @if (!typingDone()) {
          <span class="caret" aria-hidden="true">▍</span>
        }
      </p>

      <p class="subtitle muted">{{ 'mascot.subtitle' | transloco }}</p>

      <footer class="speech-actions">
        <button class="btn-pill small" type="button" (click)="speakNow($event)">
          {{ 'mascot.speak' | transloco }}
        </button>
        <button
          class="btn-secondary small"
          type="button"
          data-mascot-skip
          (click)="glideToCorner($event)"
        >
          {{ 'mascot.skip' | transloco }}
        </button>
      </footer>
    </div>
  }

  @if (phase() === 'docked' && hovered()) {
    <div class="dock-tooltip caption" role="tooltip">
      {{ 'mascot.dockHint' | transloco }}
    </div>
  }

  <button
    class="mascot-figure"
    type="button"
    [class.dancing]="phase() === 'greeting'"
    [class.gliding]="phase() === 'gliding'"
    [class.docked]="phase() === 'docked'"
    [attr.aria-label]="
      (phase() === 'docked' ? 'mascot.replay' : 'mascot.greeting') | transloco
    "
    (mouseenter)="hovered.set(true)"
    (mouseleave)="hovered.set(false)"
    (focus)="hovered.set(true)"
    (blur)="hovered.set(false)"
    (click)="onMascotClick($event)"
  >
    <!-- Ondas de radar Banda L emitidas desde la antena parabólica de la mochila de Jucu -->
    <svg class="radar-waves" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="wave w1" cx="60" cy="60" r="14" />
      <circle class="wave w2" cx="60" cy="60" r="28" />
      <circle class="wave w3" cx="60" cy="60" r="44" />
    </svg>

    <!-- Sprites generados con Gemini Nano Banana 2.1 (boca cerrada y boca abierta alineadas al píxel) -->
    <img
      class="sprite"
      [class.visible]="!mouthOpen() && !(phase() === 'docked' && hovered())"
      src="assets/mascot/jucu-smile.webp"
      [alt]="'mascot.name' | transloco"
      width="371"
      height="520"
      draggable="false"
    />
    <img
      class="sprite"
      [class.visible]="mouthOpen() || (phase() === 'docked' && hovered())"
      src="assets/mascot/jucu-talk.webp"
      [alt]="'mascot.name' | transloco"
      width="371"
      height="520"
      draggable="false"
    />
  </button>
</aside>
