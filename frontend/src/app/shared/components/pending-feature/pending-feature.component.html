<section class="pending">
  <p class="caption">{{ 'pending.kicker' | transloco }}</p>
  <h1 class="headline">{{ titleKey() | transloco }}</h1>
  <p class="lead">{{ descriptionKey() | transloco }}</p>
  <p class="body muted">{{ 'pending.body' | transloco }}</p>

  @if (needs().length) {
    <p class="label">{{ 'pending.needs' | transloco }}</p>
    <ul class="needs">
      @for (item of needs(); track item) {
        <li class="tabular">{{ item }}</li>
      }
    </ul>
  }

  <a class="btn-ghost" routerLink="/orbita" queryParamsHandling="preserve">{{ 'pending.back' | transloco }}</a>
</section>
